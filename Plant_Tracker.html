<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Plant Tracker - Dark Academia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Apply Inter font globally */
        body {
            font-family: 'Inter', sans-serif;
            /* Dark Academia Background */
            background-color: #3A2E26; /* Dark Brown */
            /* Optional: Add a subtle texture */
            /* background-image: url('...'); */
        }
        /* Simple transition for hover effects */
        button, input, select {
            transition: all 0.2s ease-in-out;
        }

        /* Dark Academia Palette */
        :root {
            --bg-dark: #3A2E26; /* Dark Brown */
            --card-bg: #F5F5DC; /* Beige/Cream */
            --text-dark: #2F4F4F; /* Dark Slate Gray/Greenish */
            --text-light: #F5F5DC; /* Beige/Cream */
            --accent-primary: #556B2F; /* Dark Olive Green */
            --accent-secondary: #DAA520; /* Goldenrod/Mustard */
            --border-color: #8B4513; /* Saddle Brown */
            --danger-light: #F87171; /* Lighter Red for text on dark */
            --warning-light: #FBBF24; /* Lighter Amber for text on dark */
            --success-light: #6EE7B7; /* Lighter Emerald for text on dark */

            --status-overdue: #DC2626; /* Red 600 */
            --status-due-today: #F59E0B; /* Amber 500 */
            --status-due-soon: #D97706; /* Amber 600 */
            --status-not-due: #10B981; /* Emerald 500 */
        }

        /* Apply Dark Theme Colors with Tailwind overrides where needed */
        body { background-color: var(--bg-dark); color: var(--text-light); }
        .card-background { background-color: var(--card-bg); }
        .text-primary { color: var(--text-dark); }
        .text-header { color: var(--accent-secondary); } /* Goldenrod for main header */
        .text-subheader { color: var(--accent-primary); } /* Dark Olive for subheaders */
        .button-primary { background-color: var(--accent-primary); color: var(--text-light); }
        .button-primary:hover { background-color: #6B8E23; /* Olive Drab - slightly lighter */ }
        .button-secondary { background-color: var(--accent-secondary); color: var(--text-dark); }
        .button-secondary:hover { background-color: #B8860B; /* DarkGoldenrod - slightly darker */ }
         .button-danger { background-color: var(--status-overdue); color: var(--text-light); }
        .button-danger:hover { background-color: #B91C1C; /* Red 700 */ }

        input[type="text"], input[type="number"], input[type="date"], input[type="url"] {
            background-color: #FFF; /* White background for inputs for readability */
            color: var(--text-dark);
            border: 1px solid var(--border-color);
        }
        input::placeholder {
             color: #9ca3af; /* Gray 400 for placeholders */
        }
        label { color: var(--text-dark); } /* Dark text for labels on light card */

        /* Status Borders */
        .overdue { border-left: 4px solid var(--status-overdue); }
        .due-today { border-left: 4px solid var(--status-due-today); }
        .due-soon { border-left: 4px solid var(--status-due-soon); }
        .not-due { border-left: 4px solid var(--status-not-due); }

        /* Status Text Colors (on light card background) */
        .text-status-overdue { color: var(--status-overdue); }
        .text-status-due-today { color: var(--status-due-today); }
        .text-status-due-soon { color: var(--status-due-soon); }
        .text-status-not-due { color: var(--status-not-due); }


        /* Ensure date input shows placeholder */
        input[type="date"]:required:invalid::-webkit-datetime-edit { color: transparent; }
        input[type="date"]:focus::-webkit-datetime-edit { color: var(--text-dark) !important; }

        /* Style for plant image */
        .plant-image {
            width: 80px; /* Fixed width */
            height: 80px; /* Fixed height */
            object-fit: cover; /* Cover the area, cropping if needed */
            border-radius: 0.375rem; /* rounded-md */
            border: 1px solid var(--border-color);
            flex-shrink: 0; /* Prevent image from shrinking */
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">
    <div class="max-w-4xl mx-auto">

        <h1 class="text-3xl md:text-4xl font-bold text-header mb-6 text-center">My House Plant Tracker</h1>

        <div class="text-center mb-6">
            <button id="enable-notifications-btn" class="button-secondary font-semibold py-2 px-4 rounded-md shadow text-sm">Enable Watering Reminders</button>
            <p id="notification-status" class="text-xs text-gray-400 mt-1"></p>
        </div>

        <div class="card-background p-6 rounded-lg shadow-md mb-8">
            <h2 class="text-2xl font-semibold text-subheader mb-4">Add New Plant</h2>
            <form id="add-plant-form" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label for="plant-name" class="block text-sm font-medium mb-1">Plant Name:</label>
                    <input type="text" id="plant-name" required class="w-full p-2 border rounded-md focus:ring-2 focus:ring-offset-1 focus:ring-[var(--accent-primary)] focus:border-[var(--accent-primary)]">
                </div>
                <div>
                    <label for="plant-species" class="block text-sm font-medium mb-1">Species (Optional):</label>
                    <input type="text" id="plant-species" class="w-full p-2 border rounded-md focus:ring-2 focus:ring-offset-1 focus:ring-[var(--accent-primary)] focus:border-[var(--accent-primary)]">
                </div>
                <div>
                    <label for="watering-frequency" class="block text-sm font-medium mb-1">Water Every (days):</label>
                    <input type="number" id="watering-frequency" min="1" required class="w-full p-2 border rounded-md focus:ring-2 focus:ring-offset-1 focus:ring-[var(--accent-primary)] focus:border-[var(--accent-primary)]">
                </div>
                <div>
                    <label for="last-watered" class="block text-sm font-medium mb-1">Last Watered:</label>
                    <input type="date" id="last-watered" required class="w-full p-2 border rounded-md focus:ring-2 focus:ring-offset-1 focus:ring-[var(--accent-primary)] focus:border-[var(--accent-primary)]">
                </div>
                 <div class="md:col-span-2">
                    <label for="plant-photo" class="block text-sm font-medium mb-1">Photo URL (Optional):</label>
                    <input type="url" id="plant-photo" placeholder="https://example.com/plant.jpg" class="w-full p-2 border rounded-md focus:ring-2 focus:ring-offset-1 focus:ring-[var(--accent-primary)] focus:border-[var(--accent-primary)]">
                </div>
                <div class="md:col-span-2">
                    <button type="submit" class="w-full button-primary font-semibold py-2 px-4 rounded-md shadow focus:outline-none focus:ring-2 focus:ring-[var(--accent-primary)] focus:ring-offset-2 focus:ring-offset-[var(--bg-dark)]">Add Plant</button>
                </div>
            </form>
        </div>

        <div>
            <h2 class="text-2xl font-semibold text-header mb-4 text-center">My Plants</h2>
            <div id="plant-list" class="space-y-4">
                <p id="no-plants-message" class="text-gray-400 italic text-center">You haven't added any plants yet!</p>
            </div>
        </div>

    </div>

    <script>
        // DOM Elements
        const plantForm = document.getElementById('add-plant-form');
        const plantNameInput = document.getElementById('plant-name');
        const plantSpeciesInput = document.getElementById('plant-species');
        const wateringFrequencyInput = document.getElementById('watering-frequency');
        const lastWateredInput = document.getElementById('last-watered');
        const plantPhotoInput = document.getElementById('plant-photo'); // New input
        const plantListDiv = document.getElementById('plant-list');
        const noPlantsMessage = document.getElementById('no-plants-message');
        const notificationBtn = document.getElementById('enable-notifications-btn');
        const notificationStatus = document.getElementById('notification-status');

        // --- Utility Functions (mostly unchanged) ---
        function daysDifference(date1, date2) {
            const oneDay = 24 * 60 * 60 * 1000;
            const d1 = new Date(date1.getFullYear(), date1.getMonth(), date1.getDate());
            const d2 = new Date(date2.getFullYear(), date2.getMonth(), date2.getDate());
            return Math.round((d1 - d2) / oneDay);
        }

        function addDays(date, days) {
            const result = new Date(date);
            result.setDate(result.getDate() + days);
            return result;
        }

        function formatDate(date) {
             // Ensure date is valid before formatting
            if (!date || isNaN(date.getTime())) {
                console.error("Invalid date passed to formatDate:", date);
                // Return today's date as a fallback, or handle as appropriate
                 return new Date().toISOString().split('T')[0];
            }
            return date.toISOString().split('T')[0];
        }

        function formatDisplayDate(date) {
             if (!date || isNaN(date.getTime())) {
                return 'N/A';
            }
            return date.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
        }

        // --- Local Storage Functions ---
        function getPlants() {
            // Add basic error handling for corrupted JSON
            try {
                const plantsData = localStorage.getItem('plants');
                return plantsData ? JSON.parse(plantsData) : [];
            } catch (e) {
                console.error("Error parsing plants from localStorage:", e);
                return []; // Return empty array if parsing fails
            }
        }

        function savePlants(plants) {
             // Ensure plants is always an array
            if (!Array.isArray(plants)) {
                console.error("Attempted to save non-array to localStorage:", plants);
                return;
            }
            localStorage.setItem('plants', JSON.stringify(plants));
        }

        // --- Notification Functions ---
        let notificationPermission = Notification.permission; // 'default', 'granted', 'denied'

        function updateNotificationStatus() {
            if (!('Notification' in window)) {
                notificationStatus.textContent = 'Notifications not supported by this browser.';
                notificationBtn.disabled = true;
                notificationBtn.classList.add('opacity-50', 'cursor-not-allowed');
                return;
            }

            switch (notificationPermission) {
                case 'granted':
                    notificationStatus.textContent = 'Watering reminders are enabled.';
                    notificationBtn.textContent = 'Reminders Enabled';
                    notificationBtn.disabled = true;
                     notificationBtn.classList.add('opacity-75', 'cursor-not-allowed');
                    break;
                case 'denied':
                    notificationStatus.textContent = 'Notifications blocked. Please enable in browser settings.';
                    notificationBtn.disabled = true;
                    notificationBtn.classList.add('opacity-50', 'cursor-not-allowed');
                    break;
                default: // 'default'
                    notificationStatus.textContent = 'Click the button above to enable reminders.';
                    notificationBtn.disabled = false;
                    notificationBtn.classList.remove('opacity-50', 'cursor-not-allowed', 'opacity-75');
                     notificationBtn.textContent = 'Enable Watering Reminders';
            }
        }

        function requestNotificationPermission() {
            if (!('Notification' in window)) {
                console.warn('Notifications not supported.');
                updateNotificationStatus();
                return;
            }

            if (notificationPermission === 'granted' || notificationPermission === 'denied') {
                console.log(`Notification permission already ${notificationPermission}.`);
                updateNotificationStatus();
                return;
            }

            Notification.requestPermission().then(permission => {
                console.log(`Notification permission: ${permission}`);
                notificationPermission = permission;
                updateNotificationStatus();
                // Optionally, check reminders immediately after permission granted
                if (permission === 'granted') {
                    checkReminders();
                }
            });
        }

        function showNotification(title, body) {
            if (notificationPermission !== 'granted') {
                console.log('Notification permission not granted.');
                return;
            }
             // Basic check to prevent spamming if the page is reloaded quickly
            if (sessionStorage.getItem('notificationShownToday')) {
                console.log("Notification already shown this session.");
                return;
            }

            new Notification(title, { body: body, icon: 'https://placehold.co/48x48/556B2F/F5F5DC?text=🌱' }); // Simple plant icon
            sessionStorage.setItem('notificationShownToday', 'true'); // Mark as shown for this session
        }

        function checkReminders() {
             if (notificationPermission !== 'granted') return;

             const plants = getPlants();
             const today = new Date();
             today.setHours(0, 0, 0, 0);
             let duePlants = [];

             plants.forEach(plant => {
                 if (!plant.lastWatered || !plant.frequency) return; // Skip if data missing

                 try {
                     const lastWateredDate = new Date(plant.lastWatered);
                     if (isNaN(lastWateredDate.getTime())) throw new Error("Invalid lastWatered date");

                     const nextWateringDate = addDays(lastWateredDate, plant.frequency);
                     nextWateringDate.setHours(0, 0, 0, 0);

                     if (daysDifference(nextWateringDate, today) === 0) {
                         duePlants.push(plant.name);
                     }
                 } catch (e) {
                     console.error(`Error calculating next watering for ${plant.name}:`, e);
                 }
             });

             if (duePlants.length > 0) {
                 const notificationTitle = "Plant Watering Reminder";
                 const notificationBody = `Plants due for watering today: ${duePlants.join(', ')}.`;
                 showNotification(notificationTitle, notificationBody);
             } else {
                 console.log("No plants due for watering today.");
                 // Clear the session storage flag if no plants are due,
                 // allowing a notification if a plant becomes due later in the session.
                 sessionStorage.removeItem('notificationShownToday');
             }
        }


        // --- Plant Management Functions ---
        /**
         * Adds a new plant to the list and saves to local storage.
         * @param {Event} event - The form submission event.
         */
        function addPlant(event) {
            event.preventDefault();

            // Validate inputs (basic)
            const name = plantNameInput.value.trim();
            const frequency = parseInt(wateringFrequencyInput.value);
            const lastWatered = lastWateredInput.value; // YYYY-MM-DD string

            if (!name || isNaN(frequency) || frequency < 1 || !lastWatered) {
                 alert("Please fill in all required fields (Name, Frequency, Last Watered).");
                 return;
            }
             // Validate date format (simple check)
             if (!/^\d{4}-\d{2}-\d{2}$/.test(lastWatered)) {
                 alert("Please enter the 'Last Watered' date in YYYY-MM-DD format.");
                 return;
             }

            const newPlant = {
                id: Date.now(),
                name: name,
                species: plantSpeciesInput.value.trim() || 'N/A',
                frequency: frequency,
                lastWatered: lastWatered,
                photoUrl: plantPhotoInput.value.trim() || '' // Add photo URL, default to empty string
            };

            const plants = getPlants();
            plants.push(newPlant);
            savePlants(plants);

            renderPlants();
            plantForm.reset();
        }

        /**
         * Updates the last watered date for a specific plant.
         * @param {number} id - The ID of the plant to update.
         */
        function waterPlant(id) {
            const plants = getPlants();
            const plantIndex = plants.findIndex(plant => plant.id === id);

            if (plantIndex > -1) {
                plants[plantIndex].lastWatered = formatDate(new Date()); // Set to today
                savePlants(plants);
                renderPlants();
            } else {
                console.error(`Plant with ID ${id} not found for watering.`);
            }
        }

        /**
         * Deletes a plant from the list.
         * @param {number} id - The ID of the plant to delete.
         */
        function deletePlant(id) {
            if (!confirm("Are you sure you want to delete this plant?")) {
                return; // Don't delete if user cancels
            }

            let plants = getPlants();
            plants = plants.filter(plant => plant.id !== id);
            savePlants(plants);
            renderPlants();
        }

        // --- Rendering Function ---
        /**
         * Renders the list of plants in the DOM.
         */
        function renderPlants() {
            plantListDiv.innerHTML = ''; // Clear current list
            const plants = getPlants();
            const today = new Date();
            today.setHours(0, 0, 0, 0); // Normalize today's date

            if (plants.length === 0) {
                noPlantsMessage.classList.remove('hidden');
                // Ensure the message is appended correctly if it was removed
                if (!plantListDiv.contains(noPlantsMessage)) {
                     plantListDiv.appendChild(noPlantsMessage);
                }
            } else {
                 noPlantsMessage.classList.add('hidden');

                 // Sort plants by next watering date (soonest first)
                 plants.sort((a, b) => {
                    try {
                        const nextWaterA = addDays(new Date(a.lastWatered), a.frequency);
                        const nextWaterB = addDays(new Date(b.lastWatered), b.frequency);
                         // Handle potential invalid dates during sort
                        if (isNaN(nextWaterA.getTime())) return 1; // Put invalid dates last
                        if (isNaN(nextWaterB.getTime())) return -1;
                        return nextWaterA - nextWaterB;
                    } catch (e) {
                        console.error("Error sorting plants:", e);
                        return 0; // Maintain original order on error
                    }
                 });

                plants.forEach(plant => {
                    const plantCard = document.createElement('div');
                    // Added card-background for the new theme
                    plantCard.className = 'card-background p-4 rounded-lg shadow-sm flex flex-col sm:flex-row items-start sm:items-center space-y-3 sm:space-y-0 sm:space-x-4';

                    let lastWateredDate, nextWateringDate, daysUntilNextWatering;
                    let statusClass = 'not-due'; // Default status
                    let statusText = 'Calculating...';
                    let displayLastWatered = 'N/A';
                    let displayNextWatering = 'N/A';

                     // Calculate dates and status safely
                    try {
                        if (!plant.lastWatered || !plant.frequency) {
                             throw new Error("Missing lastWatered date or frequency");
                        }
                        lastWateredDate = new Date(plant.lastWatered);
                         if (isNaN(lastWateredDate.getTime())) {
                             throw new Error(`Invalid lastWatered date string: ${plant.lastWatered}`);
                        }
                        lastWateredDate.setHours(0,0,0,0); // Normalize for comparison

                        nextWateringDate = addDays(lastWateredDate, plant.frequency);
                        nextWateringDate.setHours(0, 0, 0, 0); // Normalize date

                        daysUntilNextWatering = daysDifference(nextWateringDate, today);

                        displayLastWatered = formatDisplayDate(lastWateredDate);
                        displayNextWatering = formatDisplayDate(nextWateringDate);


                        if (daysUntilNextWatering < 0) {
                            statusClass = 'overdue';
                            statusText = `Overdue by ${Math.abs(daysUntilNextWatering)} days`;
                        } else if (daysUntilNextWatering === 0) {
                            statusClass = 'due-today';
                            statusText = 'Due for watering today!';
                        } else if (daysUntilNextWatering <= 2) {
                             statusClass = 'due-soon';
                             statusText = `Next watering in ${daysUntilNextWatering} days`;
                        } else {
                             statusClass = 'not-due';
                             statusText = `Next watering in ${daysUntilNextWatering} days`;
                        }
                    } catch (error) {
                        console.error(`Error processing plant ${plant.name} (ID: ${plant.id}):`, error);
                        statusText = "Error calculating status";
                        // Keep default statusClass or set to an error state if desired
                        statusClass = 'overdue'; // Indicate an issue
                    }


                    plantCard.classList.add(statusClass); // Add border color based on status

                    // Placeholder image URL
                    const placeholderUrl = `https://placehold.co/80x80/F5F5DC/3A2E26?text=${plant.name.substring(0,1)}`; // Beige bg, dark brown text initial

                    plantCard.innerHTML = `
                        <img
                            src="${plant.photoUrl || placeholderUrl}"
                            alt="${plant.name}"
                            class="plant-image"
                            onerror="this.onerror=null; this.src='${placeholderUrl}';"
                        >
                        <div class="flex-grow">
                            <h3 class="text-lg font-semibold text-subheader">${plant.name}</h3>
                            <p class="text-sm text-primary opacity-90">Species: ${plant.species}</p>
                            <p class="text-sm text-primary opacity-90">Water every ${plant.frequency} days</p>
                            <p class="text-sm text-primary opacity-90">Last watered: ${displayLastWatered}</p>
                            <p class="text-sm font-medium text-status-${statusClass}">
                                Next watering: ${displayNextWatering} (${statusText})
                            </p>
                        </div>
                        <div class="flex space-x-2 mt-2 sm:mt-0 flex-shrink-0 self-start sm:self-center">
                             <button onclick="waterPlant(${plant.id})" class="button-secondary text-xs font-medium py-1 px-3 rounded-md shadow-sm">Watered Today</button>
                            <button onclick="deletePlant(${plant.id})" class="button-danger text-xs font-medium py-1 px-3 rounded-md shadow-sm">Delete</button>
                        </div>
                    `;
                    plantListDiv.appendChild(plantCard);
                });
            }
             // Check reminders after rendering is complete
             checkReminders();
        }

        // --- Event Listeners ---
        plantForm.addEventListener('submit', addPlant);
        notificationBtn.addEventListener('click', requestNotificationPermission);

        // --- Initial Setup on Page Load ---
        document.addEventListener('DOMContentLoaded', () => {
            updateNotificationStatus(); // Set initial button state/text
            renderPlants(); // Render plants and check initial reminders
        });

    </script>
</body>
</html>
